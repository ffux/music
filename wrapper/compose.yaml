# Companion service only. The music app remains managed by vibe-deploy.
services:
  music-wrapper:
    image: ${MUSIC_WRAPPER_IMAGE:-music-wrapper:100e0a8}
    build:
      context: ${WRAPPER_SOURCE_DIR:?Set the reviewed wrapper-v2 checkout path}
      args:
        TARGET_ARCH: x86_64
        RUNTIME_PLATFORM: linux/amd64
    platform: linux/amd64
    restart: unless-stopped
    # Matches upstream chroot/native runtime requirements. Review before activation.
    cap_add: [SYS_ADMIN, SYS_CHROOT, SYS_PTRACE]
    security_opt: [apparmor:unconfined]
    environment:
      WRAPPER_HOST: 0.0.0.0
      WRAPPER_PORT: "80"
      WRAPPER_DECRYPT_HOST: 0.0.0.0
      WRAPPER_DECRYPT_PORT: "10020"
      WRAPPER_RESTORE_SESSION: "1"
    ports:
      # Operator sign-in through an SSH tunnel only; no public wrapper route.
      - "127.0.0.1:18080:80"
    volumes:
      - wrapper-session:/app/rootfs/data/data/com.apple.android.music/files
    networks:
      web:
        aliases: [music-wrapper]
volumes:
  wrapper-session:
    name: music-wrapper-session
networks:
  web:
    external: true
    name: vibe-deploy_web
